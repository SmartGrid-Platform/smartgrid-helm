{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartgrid-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  groups:

    # ── Group 1: Service Availability ─────────────────────────────────────────
    - name: smartgrid.availability
      interval: 30s
      rules:

        - alert: SmartGridServiceDown
          expr: up{namespace="{{ .Release.Namespace }}"} == 0
          for: 1m
          labels:
            severity: critical
            team: smartgrid
          annotations:
            summary: "CRITICAL — SmartGrid service {{ "{{" }} $labels.job {{ "}}" }} is DOWN"
            description: |
              Service: {{ "{{" }} $labels.job {{ "}}" }}
              Namespace: {{ .Release.Namespace }}
              Status: Unreachable for more than 1 minute
              Action: kubectl get pods -n {{ .Release.Namespace }} -l app={{ "{{" }} $labels.job {{ "}}" }}

        - alert: SmartGridPodCrashLooping
          # LOW THRESHOLD: any restart in 15m triggers this for testing
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="{{ .Release.Namespace }}"
            }[15m]) > 0
          for: 0m
          labels:
            severity: critical
            team: smartgrid
          annotations:
            summary: "CRITICAL — Pod {{ "{{" }} $labels.pod {{ "}}" }} restarted"
            description: |
              Pod: {{ "{{" }} $labels.pod {{ "}}" }}
              Container: {{ "{{" }} $labels.container {{ "}}" }}
              Restarts in last 15 min: {{ "{{" }} printf "%.0f" $value {{ "}}" }}
              Namespace: {{ .Release.Namespace }}
              Action: kubectl logs {{ "{{" }} $labels.pod {{ "}}" }} -n {{ .Release.Namespace }} --previous

        - alert: SmartGridDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
            !=
            kube_deployment_status_replicas_ready{namespace="{{ .Release.Namespace }}"}
          for: 5m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Deployment {{ "{{" }} $labels.deployment {{ "}}" }} has unhealthy replicas"
            description: |
              Deployment: {{ "{{" }} $labels.deployment {{ "}}" }}
              Namespace: {{ .Release.Namespace }}
              Expected vs Ready: mismatch for 5+ minutes
              Action: kubectl describe deployment {{ "{{" }} $labels.deployment {{ "}}" }} -n {{ .Release.Namespace }}

    # ── Group 2: HTTP Error Rates ──────────────────────────────────────────────
    - name: smartgrid.errors
      interval: 30s
      rules:

        - alert: SmartGridHighErrorRate
          # LOW THRESHOLD: 1% error rate (was 5%) — fires faster for testing
          expr: |
            (
              sum by (service) (rate(http_errors_total{
                namespace="{{ .Release.Namespace }}",
                status_code=~"5.."
              }[5m]))
              /
              sum by (service) (rate(http_requests_total{
                namespace="{{ .Release.Namespace }}"
              }[5m]))
            ) * 100 > 1
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — High error rate on {{ "{{" }} $labels.service {{ "}}" }}"
            description: |
              Service: {{ "{{" }} $labels.service {{ "}}" }}
              Error Rate: {{ "{{" }} printf "%.2f" $value {{ "}}" }}% (threshold: 1%)
              Window: last 5 minutes
              Action: kubectl logs -l app={{ "{{" }} $labels.service {{ "}}" }} -n {{ .Release.Namespace }} --tail=50

        - alert: SmartGridAuthFailureSpike
          # LOW THRESHOLD: 2 failures/min (was 20) — catches even small spikes
          expr: |
            rate(auth_login_failures_total[5m]) * 60 > 2
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Auth login failures spiking"
            description: |
              Rate: {{ "{{" }} printf "%.0f" $value {{ "}}" }} failures/minute (threshold: 2/min)
              Window: last 5 minutes
              Possible cause: wrong password attempts or brute-force attack

        - alert: SmartGridBillingFailures
          expr: |
            rate(bill_generation_failures_total[5m]) > 0
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Bill generation failures detected"
            description: |
              Rate: {{ "{{" }} printf "%.3f" $value {{ "}}" }} failures/second
              Window: last 5 minutes
              Action: kubectl logs -l app=billing-service -n {{ .Release.Namespace }} --tail=50

    # ── Group 3: Latency ───────────────────────────────────────────────────────
    - name: smartgrid.latency
      interval: 60s
      rules:

        - alert: SmartGridHighP95Latency
          # LOW THRESHOLD: 500ms P95 (was 2s) — fires on any noticeable slowness
          expr: |
            histogram_quantile(0.95,
              sum by (service, le) (
                rate(http_request_duration_seconds_bucket{
                  namespace="{{ .Release.Namespace }}"
                }[5m])
              )
            ) > 0.5
          for: 3m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Slow API responses on {{ "{{" }} $labels.service {{ "}}" }}"
            description: |
              Service: {{ "{{" }} $labels.service {{ "}}" }}
              P95 Latency: {{ "{{" }} printf "%.2f" $value {{ "}}" }}s (threshold: 0.5s)
              Window: last 5 minutes
              Action: Check database queries or downstream service timeouts

        - alert: SmartGridAIResponseSlow
          # LOW THRESHOLD: 10s P95 (was 30s)
          expr: |
            histogram_quantile(0.95,
              sum by (le) (
                rate(ai_request_duration_seconds_bucket[5m])
              )
            ) > 10
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — AI assistant Bedrock responses are slow"
            description: |
              P95 Bedrock Latency: {{ "{{" }} printf "%.1f" $value {{ "}}" }}s (threshold: 10s)
              Check: AWS Bedrock Nova Pro throttling or quota limits

    # ── Group 4: Resource Utilisation ─────────────────────────────────────────
    - name: smartgrid.resources
      interval: 30s
      rules:

        - alert: SmartGridHighCPU
          # LOW THRESHOLD: 30% CPU (was 80%) — will fire on a live cluster
          expr: |
            100 - (
              avg by (instance) (
                irate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100
            ) > 30
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — High CPU on node {{ "{{" }} $labels.instance {{ "}}" }}"
            description: |
              Node: {{ "{{" }} $labels.instance {{ "}}" }}
              CPU Usage: {{ "{{" }} printf "%.1f" $value {{ "}}" }}% (threshold: 30%)
              Duration: sustained for 2+ minutes
              Action: kubectl top pods -n {{ .Release.Namespace }} --sort-by=cpu

        - alert: SmartGridHighMemory
          # LOW THRESHOLD: 40% node memory (was 85%) — will fire on t3.small nodes
          expr: |
            (
              1 - (
                node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 40
          for: 2m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — High memory on node {{ "{{" }} $labels.instance {{ "}}" }}"
            description: |
              Node: {{ "{{" }} $labels.instance {{ "}}" }}
              Memory Usage: {{ "{{" }} printf "%.1f" $value {{ "}}" }}% (threshold: 40%)
              Duration: sustained for 2+ minutes
              Action: kubectl top pods -n {{ .Release.Namespace }} --sort-by=memory

        - alert: SmartGridPodMemoryNearLimit
          # LOW THRESHOLD: 50% of pod memory limit (was 90%)
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="{{ .Release.Namespace }}",
                container!=""
              }
              /
              container_spec_memory_limit_bytes{
                namespace="{{ .Release.Namespace }}",
                container!=""
              }
            ) * 100 > 50
          for: 3m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Pod {{ "{{" }} $labels.pod {{ "}}" }} memory above 50% of limit"
            description: |
              Pod: {{ "{{" }} $labels.pod {{ "}}" }}
              Container: {{ "{{" }} $labels.container {{ "}}" }}
              Memory Used: {{ "{{" }} printf "%.1f" $value {{ "}}" }}% of 512Mi limit
              Action: kubectl top pod {{ "{{" }} $labels.pod {{ "}}" }} -n {{ .Release.Namespace }}

    # ── Group 5: Notification Delivery ────────────────────────────────────────
    - name: smartgrid.notifications
      interval: 60s
      rules:

        - alert: SmartGridNotificationFailures
          expr: |
            rate(notifications_failed_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            team: smartgrid
          annotations:
            summary: "WARNING — Email notification delivery failures"
            description: |
              Rate: {{ "{{" }} printf "%.3f" $value {{ "}}" }} failures/second
              Window: last 5 minutes
              Action: Check SMTP credentials in AWS Secrets Manager and alert-service logs
{{- end }}
