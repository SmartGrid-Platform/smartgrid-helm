apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Monitoring stack is non-business-critical — sync manually after infra changes.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: ">=61.0.0"
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # ── Prometheus ────────────────────────────────────────────────────────────
        prometheus:
          prometheusSpec:
            # Discover ServiceMonitors in all namespaces (production + monitoring).
            # Without this, only same-namespace monitors are discovered.
            serviceMonitorNamespaceSelector: {}
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            # Discover PrometheusRules across all namespaces.
            ruleNamespaceSelector: {}
            ruleSelector:
              matchLabels:
                release: kube-prometheus-stack
            # Retain 15 days of metrics on the EKS SPOT nodes.
            # SPOT interruptions are rare (t3.small have low interruption rate)
            # and Prometheus WAL survives short interruptions via PVC.
            retention: 15d
            retentionSize: "8GB"
            # emptyDir: metrics lost on pod restart but no EBS dependency.
            # Switch to a PVC once the EBS CSI driver addon is installed.
            storageSpec:
              emptyDir: {}
            # Keep resource footprint small for t3.small SPOT nodes (2 vCPU, 2GB).
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        # ── Alertmanager ──────────────────────────────────────────────────────────
        alertmanager:
          alertmanagerSpec:
            # Mount the alertmanager-smtp secret so the config can read the
            # password from a file instead of hardcoding it in values.
            secrets:
              - alertmanager-smtp
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
          config:
            global:
              smtp_smarthost: "smtp.gmail.com:587"
              smtp_from: "fitnessofficialasad@gmail.com"
              smtp_require_tls: true
              smtp_auth_username: "fitnessofficialasad@gmail.com"
              # Password read from the mounted secret — never stored in Git.
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp_password

            route:
              receiver: "smartgrid-email"
              group_by: ["alertname", "severity"]
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 30m
              routes:
                - match:
                    severity: critical
                  receiver: "smartgrid-email"
                  repeat_interval: 15m
                - match:
                    severity: warning
                  receiver: "smartgrid-email"
                  repeat_interval: 30m

            receivers:
              - name: "smartgrid-email"
                email_configs:
                  - to: "fitnessofficialasad@gmail.com"
                    send_resolved: true
                    headers:
                      Subject: '[SmartGrid {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    html: |
                      <!DOCTYPE html>
                      <html>
                      <body style="font-family:Arial,sans-serif;max-width:600px;margin:auto;padding:20px">
                        <div style="background:{{ if eq .Status "firing" }}#d32f2f{{ else }}#388e3c{{ end }};color:white;padding:15px;border-radius:8px 8px 0 0">
                          <h2 style="margin:0">SmartGrid Platform Alert</h2>
                          <p style="margin:5px 0 0 0;font-size:14px">Status: <strong>{{ .Status | toUpper }}</strong> &nbsp;|&nbsp; {{ len .Alerts }} alert(s)</p>
                        </div>
                        <div style="border:1px solid #ddd;border-top:none;padding:15px;border-radius:0 0 8px 8px">
                          {{ range .Alerts }}
                          <div style="border-left:4px solid {{ if eq .Labels.severity "critical" }}#d32f2f{{ else }}#f57c00{{ end }};padding:10px;margin:10px 0;background:#fafafa">
                            <p style="margin:0 0 8px 0;font-size:16px;font-weight:bold">{{ .Annotations.summary }}</p>
                            <pre style="background:#f0f0f0;padding:10px;border-radius:4px;font-size:12px;white-space:pre-wrap">{{ .Annotations.description }}</pre>
                            <p style="margin:8px 0 0 0;font-size:12px;color:#666">
                              Severity: <strong>{{ .Labels.severity | toUpper }}</strong> &nbsp;|&nbsp;
                              Fired: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
                              {{ if eq .Status "resolved" }}&nbsp;|&nbsp; Resolved: {{ .EndsAt.Format "2006-01-02 15:04:05 UTC" }}{{ end }}
                            </p>
                          </div>
                          {{ end }}
                          <hr style="border:none;border-top:1px solid #eee">
                          <p style="font-size:11px;color:#999;margin:10px 0 0 0">SmartGrid Platform — EKS ap-south-1 &nbsp;|&nbsp; Cluster: smartgrid-default</p>
                        </div>
                      </body>
                      </html>

            inhibit_rules:
              - source_match:
                  alertname: SmartGridServiceDown
                  severity: critical
                target_match:
                  severity: warning
                equal: ["alertname"]

        # ── Grafana ───────────────────────────────────────────────────────────────
        grafana:
          enabled: true
          # Pin to 10.4.x — Grafana 11+ introduces the "app platform" API server
          # (/apis/dashboard.grafana.app/) which times out without full K8s RBAC setup,
          # blocking the liveness probe and causing a restart loop.
          image:
            repository: grafana/grafana
            tag: "10.4.7"
            pullPolicy: IfNotPresent
          # Admin password is bootstrapped from Secrets Manager.
          # Change this via argocd application override --set grafana.adminPassword=...
          # or from Secrets Manager key GRAFANA_ADMIN_PASSWORD pre-created by bootstrap.
          adminPassword: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          sidecar:
            dashboards:
              # The sidecar scans all namespaces for ConfigMaps with label grafana_dashboard="1"
              # and auto-imports them. Our smartgrid dashboard ConfigMaps use this label.
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
              labelValue: "1"
            datasources:
              enabled: true
          persistence:
            enabled: false
          grafana.ini:
            server:
              # Grafana is served at /grafana on the same ALB as the SmartGrid APIs.
              # serve_from_sub_path=true makes Grafana rewrite all asset URLs to /grafana/...
              # Without this, the browser loads JS/CSS from / and gets a 404 from the ALB.
              root_url: "%(protocol)s://%(domain)s/grafana"
              serve_from_sub_path: true
            auth.anonymous:
              enabled: false
            # SMTP for Grafana alerts (separate from Alertmanager SMTP).
            smtp:
              enabled: false

          # ALB Ingress — shares the same ALB as SmartGrid services via IngressGroup.
          # Grafana is accessible at http://<alb-dns>/grafana — no extra ALB cost.
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              kubernetes.io/ingress.class: alb
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
              alb.ingress.kubernetes.io/group.name: smartgrid
              # Must match the load-balancer-name on the SmartGrid ingress so both
              # ingresses share the SAME ALB — without this the controller creates a
              # second ALB for the group, doubling costs.
              alb.ingress.kubernetes.io/load-balancer-name: smartgrid-default-eks-alb
              alb.ingress.kubernetes.io/healthcheck-path: /grafana/api/health
              alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
              alb.ingress.kubernetes.io/success-codes: "200"
            hosts:
              - ""
            path: /grafana
            pathType: Prefix

        # ── node-exporter ─────────────────────────────────────────────────────────
        nodeExporter:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # ── kube-state-metrics ────────────────────────────────────────────────────
        kubeStateMetrics:
          enabled: true

        # ── Admission Webhooks ────────────────────────────────────────────────────
        # Disabled — the admission-create/patch jobs consume pod slots and the
        # webhooks are not needed for CRD validation in a dev/project cluster.
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
